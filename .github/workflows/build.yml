name: Build desktop installers

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: mac
            arch: arm64
            build_command: npm run dist:mac -- --arm64
            artifact_name: auto-codex-companion-mac-arm64
            artifacts: dist/*.dmg
          - os: macos-15-intel
            target: mac
            arch: x64
            build_command: npm run dist:mac -- --x64
            artifact_name: auto-codex-companion-mac-x64
            artifacts: dist/*.dmg
          - os: windows-latest
            target: win
            arch: x64
            build_command: npm run dist:win
            artifact_name: auto-codex-companion-win-x64
            artifacts: dist/*.exe
          - os: ubuntu-latest
            target: linux
            arch: x64
            build_command: npm run dist:linux
            artifact_name: auto-codex-companion-linux-x64
            artifacts: |
              dist/*.AppImage
              dist/*.deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python -m pip install --upgrade pip pyinstaller certifi
      - run: python scripts/build_backend.py
      - run: npm install
      - run: ${{ matrix.build_command }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
